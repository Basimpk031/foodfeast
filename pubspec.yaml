name: foodfeast
description: FoodFeast - Food Delivery App (Final Year Project)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  razorpay_flutter: ^1.4.0
  shared_preferences: ^2.2.0

  # Firebase (pinned)
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.4
  firebase_storage: 12.3.2
  firebase_messaging: 15.1.3

  flutter_local_notifications: ^17.2.1+2

  http: ^1.2.1
  googleapis_auth: ^1.4.1
  google_sign_in: ^6.2.1

  # Location & Maps — OpenStreetMap (free, no API key needed)
  geolocator: ^12.0.0
  flutter_map: ^7.0.2       # replaces google_maps_flutter
  latlong2: ^0.9.1           # LatLng type for flutter_map
  permission_handler: ^11.3.1
  # geocoding and google_maps_flutter removed — Nominatim used instead (built into location_service.dart)

  cupertino_icons: ^1.0.8
  fluttertoast: ^8.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/service_account.json